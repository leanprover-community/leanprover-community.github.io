<!DOCTYPE HTML>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel="canonical" href="https://mathlib.org/contribute/style.html">
        <!-- Carry the #anchor across, so links to a section still land on it.
             The meta refresh would drop it, and could fire before the script's
             navigation completes, so it is only for browsers without scripts. -->
        <script type="text/javascript">
            window.location.replace("https://mathlib.org/contribute/style.html" + window.location.hash)
        </script>
        <noscript>
            <meta http-equiv="refresh" content="0; url=https://mathlib.org/contribute/style.html">
        </noscript>
        <title>Page Moved</title>
    </head>
    <body>
        This webpage (about mathlib's style guidelines) has moved to mathlib's webpage. If you are not redirected automatically, follow this <a href='https://mathlib.org/contribute/style.html'>link to the style guide</a>.
    </body>
</html>
